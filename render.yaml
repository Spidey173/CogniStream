services:
  # ---------------------------------------------------------------------------
  # FastAPI Computer Vision Backend (Native Python)
  # ---------------------------------------------------------------------------
  - type: web
    name: cognistream-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_AGs3zgUYIqm8@ep-cold-union-ae0qi9d0-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: API_KEY
        value: dev-secret-api-key
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: BATCH_SIZE
        value: "50"
      - key: BATCH_FLUSH_INTERVAL
        value: "2.0"
      - key: DETECTION_CONFIDENCE
        value: "0.5"
      - key: DETECTOR_TYPE
        value: mediapipe
      - key: REDIS_URL
        value: "" # Uses resilient InMemoryMessageBus fallback when empty
