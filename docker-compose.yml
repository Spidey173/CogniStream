# Production Docker Compose for Real-Time Vision Streaming System.
# Services:
#   frontend  → React + Nginx proxy    → http://localhost:3000
#   backend   → FastAPI (multi-node)   → http://localhost:8000
#   redis     → Pub/Sub Frame Bus      → :6379
#   db        → PostgreSQL 16 DB       → :5433

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/facedetect
      - DATABASE_URL_SYNC=postgresql+psycopg2://postgres:postgres@db:5432/facedetect
      - REDIS_URL=redis://redis:6379/0
      - API_KEY=dev-secret-api-key
      - BATCH_SIZE=50
      - BATCH_FLUSH_INTERVAL=2.0
      - DETECTION_CONFIDENCE=0.5
      - DEBUG=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: facedetect
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
